name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                # stdlib_debug and libc++ work because tests/CMakeLists.txt propagates the stdlib
                # and debug-ABI flags to the fetched fmt as well
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: gcc, cxx: g++, stdlib_debug: true, sanitizer: address}
                    - {cc: gcc, cxx: g++, stdlib_debug: true, sanitizer: thread}
                    - {cc: clang, cxx: clang++}
                    - {cc: clang, cxx: clang++, stdlib: libc++, stdlib_debug: true, sanitizer: address}
                    - {cc: clang, cxx: clang++, stdlib: libc++, stdlib_debug: true, sanitizer: thread}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm
                pacman -S --noconfirm git cmake base-devel python ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }} ${{ matrix.compiler.stdlib == 'libc++' && 'libc++ lld' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Configure CMake
              run: >
                cmake -S tests -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                -DUSE_FORCE_FETCH=ON
                -DUSE_WARNINGS_AS_ERRORS=ON
                ${{ matrix.compiler.sanitizer && format('-DUSE_SANITIZER={0}', matrix.compiler.sanitizer) || '' }}
                ${{ matrix.compiler.stdlib && format('-DUSE_STD_LIB={0}', matrix.compiler.stdlib) || '' }}
                ${{ matrix.compiler.stdlib_debug && '-DUSE_STDLIB_DEBUG=true' || '' }}
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build project
              run: cmake --build build -j"$(nproc)"

            - name: Run tests
              run: cd build && ctest --output-on-failure

            # clang-tidy (Kvasir_SDK master's tools/tidy.py and .clang-tidy, .github/actions/tidy) over this tree:
            # this repository's findings fail, the libraries' are counted as foreign
            - name: clang-tidy
              if: matrix.compiler.cc == 'clang' && !matrix.compiler.sanitizer
              uses: kvasir-io/Kvasir_SDK/.github/actions/tidy@master
              timeout-minutes: 30
              with:
                trees: build
